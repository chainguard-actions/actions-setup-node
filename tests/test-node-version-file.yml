name: Test node setup from version file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create .nvmrc file
        run: |
          echo "20" > .nvmrc
          cat .nvmrc
      - id: setup-node
        uses: .
        with:
          node-version-file: '.nvmrc'
      - name: Assert node-version output is set
        env:
          NODE_VERSION_OUTPUT: ${{ steps.setup-node.outputs.node-version }}
        run: |
          echo "node-version output: $NODE_VERSION_OUTPUT"
          if [ -z "$NODE_VERSION_OUTPUT" ]; then
            echo "FAIL: node-version output is empty"
            exit 1
          fi
          echo "PASS: node-version output is set to $NODE_VERSION_OUTPUT"
      - name: Assert node major version matches .nvmrc
        run: |
          echo "node version: $(node --version)"
          NODE_MAJOR=$(node --version | sed 's/v//' | cut -d. -f1)
          echo "node major: $NODE_MAJOR"
          if [ "$NODE_MAJOR" != "20" ]; then
            echo "FAIL: expected node major version 20, got $NODE_MAJOR"
            exit 1
          fi
          echo "PASS: node major version is 20"
