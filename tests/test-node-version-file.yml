name: Test node-version-file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          node-version-file: tests/fixtures/.nvmrc
      - name: Assert version from .nvmrc
        env:
          ACTUAL: ${{ steps.action.outputs.node-version }}
        run: |
          echo "output: $ACTUAL"
          echo "node on PATH: $(node --version)"
          case "$ACTUAL" in
            v22.*) ;;
            *) echo "FAIL: expected output to start with v22."; exit 1 ;;
          esac
          if [ "$(node --version)" != "$ACTUAL" ]; then
            echo "FAIL: node on PATH does not match output"
            exit 1
          fi
          echo "PASS"
