name: Test node-version-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create .nvmrc file
        run: echo "20" > .nvmrc
      - id: action
        uses: .
        with:
          node-version-file: '.nvmrc'
      - name: Assert node-version output
        env:
          NODE_VER: ${{ steps.action.outputs.node-version }}
        run: |
          echo "node-version: $NODE_VER"
          if [ -z "$NODE_VER" ]; then
            echo "FAIL: node-version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert node is available
        run: |
          node --version
          echo "PASS"
