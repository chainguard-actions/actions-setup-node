name: Test Node.js setup from version file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create .nvmrc file
        run: |
          echo "18" > .nvmrc
          cat .nvmrc
      - id: setup
        uses: .
        continue-on-error: true
        with:
          node-version-file: '.nvmrc'
      - name: Assert node setup from version file ran
        env:
          OUTCOME: ${{ steps.setup.outcome }}
          NODE_VERSION: ${{ steps.setup.outputs.node-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "node-version output: $NODE_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$NODE_VERSION" ]; then
              echo "FAIL: action succeeded but node-version output is empty"
              exit 1
            fi
            echo "PASS: node-version='$NODE_VERSION'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (node24 runtime or network not available in act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
