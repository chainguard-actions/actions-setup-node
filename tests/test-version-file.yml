name: Test Node.js setup from version file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TOOL_CACHE: /tmp/hostedtoolcache
      RUNNER_TEMP: /tmp/runner-temp
      RUNNER_OS: Linux
      RUNNER_ARCH: X64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare runner environment
        run: |
          mkdir -p /tmp/hostedtoolcache
          mkdir -p /tmp/runner-temp
      - name: Create .nvmrc file
        run: |
          echo "18" > .nvmrc
          echo "Created .nvmrc with content:"
          cat .nvmrc
      - id: setup-node
        uses: .
        with:
          node-version-file: '.nvmrc'
      - name: Assert node-version output is set
        env:
          NODE_VERSION_OUT: ${{ steps.setup-node.outputs.node-version }}
        run: |
          echo "node-version output: $NODE_VERSION_OUT"
          if [ -z "$NODE_VERSION_OUT" ]; then
            echo "FAIL: node-version output is empty"
            exit 1
          fi
          echo "PASS: node-version output is set to $NODE_VERSION_OUT"
      - name: Assert node major version matches .nvmrc
        run: |
          echo "node version: $(node --version)"
          NODE_MAJOR=$(node --version | sed 's/v//' | cut -d. -f1)
          echo "node major: $NODE_MAJOR"
          if [ "$NODE_MAJOR" != "18" ]; then
            echo "FAIL: expected node major version 18, got $NODE_MAJOR"
            exit 1
          fi
          echo "PASS: node major version is 18"
