name: Test LTS node version alias
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          node-version: 'lts/*'
          token: ${{ github.token }}
      - name: Assert node-version output is set
        env:
          NODE_VER: ${{ steps.setup.outputs.node-version }}
        run: |
          echo "node-version output: $NODE_VER"
          if [ -z "$NODE_VER" ]; then
            echo "FAIL: node-version output is empty"
            exit 1
          fi
          echo "PASS: node-version output is '$NODE_VER'"
      - name: Assert node is available and is an LTS version
        run: |
          echo "node version: $(node --version)"
          MAJOR=$(node --version | sed 's/v//' | cut -d. -f1)
          echo "major: $MAJOR"
          # LTS versions are even-numbered majors (18, 20, 22, ...)
          if [ $((MAJOR % 2)) -ne 0 ]; then
            echo "FAIL: expected an even (LTS) major version, got $MAJOR"
            exit 1
          fi
          echo "PASS: node major version $MAJOR is an LTS (even) version"
      - name: Assert npm is available
        run: |
          echo "npm version: $(npm --version)"
          if ! command -v npm > /dev/null 2>&1; then
            echo "FAIL: npm not found"
            exit 1
          fi
          echo "PASS: npm is available"
