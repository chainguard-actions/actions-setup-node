name: Test basic node version setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          node-version: '20'
      - name: Assert node-version output is set
        env:
          NODE_VER: ${{ steps.setup.outputs.node-version }}
        run: |
          echo "node-version output: $NODE_VER"
          if [ -z "$NODE_VER" ]; then
            echo "FAIL: node-version output is empty"
            exit 1
          fi
          echo "PASS: node-version output is '$NODE_VER'"
      - name: Assert node is on PATH and correct major version
        run: |
          echo "node path: $(which node)"
          ACTUAL=$(node --version)
          echo "node --version: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q '^v20\.'; then
            echo "FAIL: expected node v20.x but got $ACTUAL"
            exit 1
          fi
          echo "PASS: node version is $ACTUAL"
      - name: Assert npm is on PATH
        run: |
          echo "npm path: $(which npm)"
          npm --version
          echo "PASS: npm is available"
