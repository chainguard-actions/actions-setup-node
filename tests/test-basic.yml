name: Test basic node version setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-node
        uses: .
        with:
          node-version: '20'
      - name: Assert node-version output is set
        env:
          NODE_VERSION_OUT: ${{ steps.setup-node.outputs.node-version }}
        run: |
          echo "node-version output: $NODE_VERSION_OUT"
          if [ -z "$NODE_VERSION_OUT" ]; then
            echo "FAIL: node-version output is empty"
            exit 1
          fi
          echo "PASS: node-version output is set to $NODE_VERSION_OUT"
      - name: Assert node is available on PATH
        run: |
          echo "node path: $(which node)"
          NODE_VER=$(node --version)
          echo "node version: $NODE_VER"
          if [ -z "$NODE_VER" ]; then
            echo "FAIL: node is not available"
            exit 1
          fi
          echo "PASS: node is available: $NODE_VER"
      - name: Assert node version matches requested major
        run: |
          NODE_VER=$(node --version)
          echo "node version: $NODE_VER"
          MAJOR=$(echo "$NODE_VER" | sed 's/v\([0-9]*\).*/\1/')
          echo "major version: $MAJOR"
          if [ "$MAJOR" != "20" ]; then
            echo "FAIL: expected major version 20, got $MAJOR"
            exit 1
          fi
          echo "PASS: node major version is 20"
      - name: Assert npm is available
        run: |
          NPM_VER=$(npm --version)
          echo "npm version: $NPM_VER"
          if [ -z "$NPM_VER" ]; then
            echo "FAIL: npm is not available"
            exit 1
          fi
          echo "PASS: npm is available: $NPM_VER"
