name: Test basic node version setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          node-version: '18'
      - name: Assert node-version output is set
        env:
          ACTUAL: ${{ steps.setup.outputs.node-version }}
        run: |
          echo "actual node-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: node-version output is empty"
            exit 1
          fi
          echo "PASS: node-version output is set to $ACTUAL"
      - name: Assert node is on PATH and correct major version
        run: |
          echo "node version: $(node --version)"
          MAJOR=$(node --version | sed 's/v//' | cut -d. -f1)
          echo "major version: $MAJOR"
          if [ "$MAJOR" != "18" ]; then
            echo "FAIL: expected major version 18, got $MAJOR"
            exit 1
          fi
          echo "PASS: node major version is 18"
      - name: Assert npm is on PATH
        run: |
          echo "npm version: $(npm --version)"
          if ! command -v npm &> /dev/null; then
            echo "FAIL: npm not found on PATH"
            exit 1
          fi
          echo "PASS: npm is available"
      - name: Assert node runs a script
        run: |
          node -e "console.log('Node.js is working, version:', process.version)"
          echo "PASS: node executed successfully"
