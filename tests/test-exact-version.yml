name: Test Node.js setup with exact version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: setup-node
        uses: .
        with:
          node-version: '20.11.0'
      - name: Assert node-version output is set
        env:
          ACTUAL: ${{ steps.setup-node.outputs.node-version }}
        run: |
          echo "actual node-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: node-version output is empty"
            exit 1
          fi
          echo "PASS: node-version output is '$ACTUAL'"
      - name: Assert exact node version is installed
        run: |
          NODE_VERSION=$(node --version)
          echo "node version: $NODE_VERSION"
          if [ "$NODE_VERSION" != "v20.11.0" ]; then
            echo "FAIL: expected node v20.11.0, got $NODE_VERSION"
            exit 1
          fi
          echo "PASS: exact node version v20.11.0 is installed"
      - name: Assert node-version output matches exact version
        env:
          ACTUAL: ${{ steps.setup-node.outputs.node-version }}
        run: |
          echo "actual node-version output: $ACTUAL"
          if [ "$ACTUAL" != "v20.11.0" ]; then
            echo "FAIL: expected node-version output 'v20.11.0', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: node-version output matches 'v20.11.0'"
