name: Test registry-url and scope inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: setup-node
        uses: .
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          scope: '@myorg'
      - name: Assert node-version output is set
        env:
          ACTUAL: ${{ steps.setup-node.outputs.node-version }}
        run: |
          echo "actual node-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: node-version output should not be empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert node is available
        run: |
          node --version
          echo "PASS: node is available"
