name: Test registry-url configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
      - name: Assert node-version output is set
        env:
          NODE_VER: ${{ steps.setup.outputs.node-version }}
        run: |
          echo "node-version output: $NODE_VER"
          if [ -z "$NODE_VER" ]; then
            echo "FAIL: node-version output is empty"
            exit 1
          fi
          echo "PASS: node-version output is '$NODE_VER'"
      - name: Assert node is on PATH
        run: |
          echo "node version: $(node --version)"
          MAJOR=$(node --version | sed 's/v//' | cut -d. -f1)
          if [ "$MAJOR" != "20" ]; then
            echo "FAIL: expected major version 20, got $MAJOR"
            exit 1
          fi
          echo "PASS: node major version is 20"
      - name: Assert .npmrc is configured with registry
        run: |
          echo "Checking for .npmrc configuration..."
          # The action creates a project-level .npmrc when registry-url is set
          if [ -f ".npmrc" ]; then
            echo ".npmrc contents:"
            cat .npmrc
            if grep -q "registry.npmjs.org" .npmrc; then
              echo "PASS: .npmrc contains registry.npmjs.org"
            else
              echo "FAIL: .npmrc does not contain expected registry URL"
              exit 1
            fi
          else
            # Check global npmrc
            GLOBAL_NPMRC=$(npm config get userconfig 2>/dev/null || true)
            echo "Global npmrc path: $GLOBAL_NPMRC"
            REGISTRY=$(npm config get registry 2>/dev/null || true)
            echo "npm registry: $REGISTRY"
            if echo "$REGISTRY" | grep -q "registry.npmjs.org"; then
              echo "PASS: npm registry is set to registry.npmjs.org"
            else
              echo "FAIL: registry not configured as expected"
              exit 1
            fi
          fi
