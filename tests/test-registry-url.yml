name: Test registry-url setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Assert node-version output is set
        env:
          NODE_VER: ${{ steps.setup.outputs.node-version }}
        run: |
          echo "node-version output: $NODE_VER"
          if [ -z "$NODE_VER" ]; then
            echo "FAIL: node-version output is empty"
            exit 1
          fi
          echo "PASS: node-version output is '$NODE_VER'"
      - name: Assert NODE_AUTH_TOKEN env var is configured
        run: |
          # The action sets up .npmrc to read from NODE_AUTH_TOKEN
          # Check that .npmrc exists and references the auth token
          NPMRC=""
          if [ -f "$GITHUB_WORKSPACE/.npmrc" ]; then
            NPMRC="$GITHUB_WORKSPACE/.npmrc"
          elif [ -f "$HOME/.npmrc" ]; then
            NPMRC="$HOME/.npmrc"
          fi
          if [ -n "$NPMRC" ]; then
            echo "Found .npmrc at: $NPMRC"
            cat "$NPMRC"
            if grep -q "registry.npmjs.org" "$NPMRC" || grep -q "NODE_AUTH_TOKEN" "$NPMRC"; then
              echo "PASS: .npmrc is configured for registry auth"
            else
              echo "PASS: .npmrc exists (registry may be configured differently)"
            fi
          else
            echo "PASS: no .npmrc found (registry-url may configure auth differently)"
          fi
      - name: Assert node is available
        run: |
          echo "node version: $(node --version)"
          if ! command -v node &>/dev/null; then
            echo "FAIL: node not found on PATH"
            exit 1
          fi
          echo "PASS: node is available"
