name: Test node setup with version range
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          node-version: '>=18.0.0'
      - name: Assert node-version output is set
        env:
          NODE_VER: ${{ steps.setup.outputs.node-version }}
        run: |
          echo "node-version output: $NODE_VER"
          if [ -z "$NODE_VER" ]; then
            echo "FAIL: node-version output is empty"
            exit 1
          fi
          echo "PASS: node-version output is set to $NODE_VER"
      - name: Assert node version satisfies range >=18
        run: |
          echo "node version: $(node --version)"
          MAJOR=$(node --version | sed 's/v//' | cut -d. -f1)
          echo "major version: $MAJOR"
          if [ "$MAJOR" -lt 18 ]; then
            echo "FAIL: expected major version >= 18, got $MAJOR"
            exit 1
          fi
          echo "PASS: node major version $MAJOR satisfies >=18"
      - name: Assert node binary is functional
        run: |
          RESULT=$(node -e "console.log(1 + 1)")
          echo "node eval result: $RESULT"
          if [ "$RESULT" != "2" ]; then
            echo "FAIL: expected '2', got '$RESULT'"
            exit 1
          fi
          echo "PASS: node binary is functional"
