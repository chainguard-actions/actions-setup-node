name: Test cache-dependency-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a package-lock.json for cache dependency
        run: |
          mkdir -p hardened/tests/fixtures/npm-project
          cat > hardened/tests/fixtures/npm-project/package.json <<'EOF'
          {
            "name": "test-project",
            "version": "1.0.0",
            "dependencies": {}
          }
          EOF
          cat > hardened/tests/fixtures/npm-project/package-lock.json <<'EOF'
          {
            "name": "test-project",
            "version": "1.0.0",
            "lockfileVersion": 3,
            "requires": true,
            "packages": {
              "": {
                "name": "test-project",
                "version": "1.0.0"
              }
            }
          }
          EOF
      - id: action
        uses: .
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: hardened/tests/fixtures/npm-project/package-lock.json
      - name: Assert node-version output is set
        env:
          NODE_VER: ${{ steps.action.outputs.node-version }}
          CACHE_KEY: ${{ steps.action.outputs.cache-primary-key }}
        run: |
          echo "node-version: $NODE_VER"
          echo "cache-primary-key: $CACHE_KEY"
          if [ -z "$NODE_VER" ]; then
            echo "FAIL: node-version output is empty"
            exit 1
          fi
          echo "PASS: node installed, cache-dependency-path accepted"
