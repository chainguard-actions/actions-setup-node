name: Test cache-dependency-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a package-lock.json for caching
        run: |
          mkdir -p /tmp/myapp
          cat > /tmp/myapp/package-lock.json <<'EOF'
          {
            "name": "myapp",
            "version": "1.0.0",
            "lockfileVersion": 2,
            "requires": true,
            "packages": {
              "": {
                "name": "myapp",
                "version": "1.0.0"
              }
            }
          }
          EOF
      - id: setup-node
        uses: .
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: /tmp/myapp/package-lock.json
      - name: Assert node-version output is set
        env:
          NODE_VER: ${{ steps.setup-node.outputs.node-version }}
        run: |
          echo "node-version: $NODE_VER"
          if [ -z "$NODE_VER" ]; then
            echo "FAIL: node-version output is empty"
            exit 1
          fi
          echo "PASS: node-version is $NODE_VER"
      - name: Assert cache-primary-key output is set
        env:
          CACHE_KEY: ${{ steps.setup-node.outputs.cache-primary-key }}
        run: |
          echo "cache-primary-key: $CACHE_KEY"
          if [ -z "$CACHE_KEY" ]; then
            echo "FAIL: cache-primary-key output is empty"
            exit 1
          fi
          echo "PASS: cache-primary-key is $CACHE_KEY"
