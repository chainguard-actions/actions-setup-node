name: Test cache-dependency-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create a package-lock.json for caching
        run: |
          mkdir -p subproject
          cat > subproject/package.json <<'EOF'
          {
            "name": "test-project",
            "version": "1.0.0",
            "lockfileVersion": 1
          }
          EOF
          cat > subproject/package-lock.json <<'EOF'
          {
            "name": "test-project",
            "version": "1.0.0",
            "lockfileVersion": 1,
            "requires": true,
            "dependencies": {}
          }
          EOF
      - id: setup-node
        uses: .
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'subproject/package-lock.json'
      - name: Assert node-version output is set
        env:
          ACTUAL: ${{ steps.setup-node.outputs.node-version }}
        run: |
          echo "actual node-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: node-version output should not be empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert node is available
        run: |
          node --version
          echo "PASS: node is available"
