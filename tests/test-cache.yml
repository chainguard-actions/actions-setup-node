name: Test cache and cache-dependency-path inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create package.json and package-lock.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "test-project",
            "version": "1.0.0",
            "dependencies": {}
          }
          EOF
          cat > package-lock.json <<'EOF'
          {
            "name": "test-project",
            "version": "1.0.0",
            "lockfileVersion": 3,
            "requires": true,
            "packages": {
              "": {
                "name": "test-project",
                "version": "1.0.0"
              }
            }
          }
          EOF
      - id: action
        uses: .
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - name: Assert node-version output
        env:
          NODE_VER: ${{ steps.action.outputs.node-version }}
        run: |
          echo "node-version output: $NODE_VER"
          if [ -z "$NODE_VER" ]; then
            echo "FAIL: node-version output is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert node is on PATH
        run: |
          node --version
          echo "PASS: node is available"
