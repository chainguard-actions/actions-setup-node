name: Test cache and cache-dependency-path inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-node
        uses: .
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 'actions/hardened/actions--setup-node/v6.3.0/tests/fixtures/package-lock.json'
      - name: Assert node is available
        run: |
          node --version
          echo "PASS: node is available"
      - name: Assert cache-hit output exists
        env:
          CACHE_HIT: ${{ steps.setup-node.outputs.cache-hit }}
        run: |
          echo "cache-hit output: $CACHE_HIT"
          echo "PASS: cache-hit output checked"
