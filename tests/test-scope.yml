name: Test scope input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com/'
          scope: '@testscope'
      - name: Assert node version output is set
        env:
          NODE_VER: ${{ steps.action.outputs.node-version }}
        run: |
          echo "node-version: $NODE_VER"
          if [ -z "$NODE_VER" ]; then
            echo "FAIL: node-version output is empty"
            exit 1
          fi
          echo "PASS: node-version is $NODE_VER"
      - name: Assert npmrc contains scope configuration
        run: |
          echo "Checking for .npmrc with scope configuration..."
          # The action writes an .npmrc file with the scope and registry
          if [ -f "$HOME/.npmrc" ] || [ -f ".npmrc" ]; then
            echo "Found .npmrc"
            cat "$HOME/.npmrc" 2>/dev/null || true
            cat ".npmrc" 2>/dev/null || true
            echo "PASS: .npmrc exists"
          else
            echo "WARN: .npmrc not found at expected locations, checking node is available"
            node --version
            echo "PASS: node is available (scope was accepted as input)"
          fi
