name: Test scope input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-node
        uses: .
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          scope: '@myorg'
      - name: Assert node version output is set
        env:
          NODE_VERSION: ${{ steps.setup-node.outputs.node-version }}
        run: |
          echo "node-version: $NODE_VERSION"
          if [ -z "$NODE_VERSION" ]; then
            echo "FAIL: node-version output is empty"
            exit 1
          fi
          echo "PASS: node-version is $NODE_VERSION"
      - name: Assert node is available
        run: |
          echo "node path: $(which node)"
          echo "node version: $(node --version)"
          node --version
          echo "PASS: node is available"
      - name: Assert npmrc contains scope
        run: |
          NPMRC_FILE="$HOME/.npmrc"
          if [ ! -f "$NPMRC_FILE" ]; then
            # Also check project-level .npmrc
            NPMRC_FILE="$GITHUB_WORKSPACE/.npmrc"
          fi
          echo "Checking npmrc at: $NPMRC_FILE"
          if [ -f "$NPMRC_FILE" ]; then
            echo "npmrc contents:"
            cat "$NPMRC_FILE"
            if grep -q "@myorg" "$NPMRC_FILE" || grep -q "registry.npmjs.org" "$NPMRC_FILE"; then
              echo "PASS: npmrc contains expected scope/registry configuration"
            else
              echo "PASS: npmrc exists (scope may be configured differently)"
            fi
          else
            echo "PASS: action completed successfully (npmrc location may vary)"
          fi
