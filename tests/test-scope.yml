name: Test scope input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-node
        uses: .
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@myorg'
      - name: Assert node-version output is set
        env:
          NODE_VER: ${{ steps.setup-node.outputs.node-version }}
        run: |
          echo "node-version: $NODE_VER"
          if [ -z "$NODE_VER" ]; then
            echo "FAIL: node-version output is empty"
            exit 1
          fi
          echo "PASS: node-version is $NODE_VER"
      - name: Assert .npmrc contains scope
        run: |
          if [ -f "$GITHUB_WORKSPACE/.npmrc" ]; then
            echo "Contents of .npmrc:"
            cat "$GITHUB_WORKSPACE/.npmrc"
            if grep -q "@myorg" "$GITHUB_WORKSPACE/.npmrc"; then
              echo "PASS: scope @myorg found in .npmrc"
            else
              echo "FAIL: scope @myorg not found in .npmrc"
              exit 1
            fi
          else
            echo "No .npmrc found in workspace, checking home dir"
            if [ -f "$HOME/.npmrc" ]; then
              cat "$HOME/.npmrc"
              echo "PASS: .npmrc exists in home dir"
            else
              echo "FAIL: no .npmrc found anywhere"
              exit 1
            fi
          fi
