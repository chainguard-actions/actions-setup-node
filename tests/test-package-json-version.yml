name: Test node version from package.json
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create package.json with engines.node field
        run: |
          # Remove any existing symlink before creating the file
          rm -f "$GITHUB_WORKSPACE/package.json"
          cat > "$GITHUB_WORKSPACE/package.json" << 'EOF'
          {
            "name": "test-app",
            "version": "1.0.0",
            "engines": {
              "node": ">=18"
            }
          }
          EOF
          echo "Created package.json:"
          cat "$GITHUB_WORKSPACE/package.json"
      - id: setup
        uses: .
        with:
          node-version-file: 'package.json'
      - name: Assert node-version output is set
        env:
          NODE_VER: ${{ steps.setup.outputs.node-version }}
        run: |
          echo "node-version output: $NODE_VER"
          if [ -z "$NODE_VER" ]; then
            echo "FAIL: node-version output is empty"
            exit 1
          fi
          echo "PASS: node-version output is '$NODE_VER'"
      - name: Assert node is available and meets minimum version
        run: |
          echo "node version: $(node --version)"
          MAJOR=$(node --version | sed 's/v//' | cut -d. -f1)
          echo "major: $MAJOR"
          if [ "$MAJOR" -lt "18" ]; then
            echo "FAIL: expected node >= 18, got major $MAJOR"
            exit 1
          fi
          echo "PASS: node major version $MAJOR meets >=18 requirement"
