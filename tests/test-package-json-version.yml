name: Test node version from package.json
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create package.json with engines.node field
        run: |
          cat > package.json <<'EOF'
          {
            "name": "test-project",
            "version": "1.0.0",
            "engines": {
              "node": "18.x"
            }
          }
          EOF
          echo "Created package.json:"
          cat package.json
      - id: setup
        uses: .
        with:
          node-version-file: 'package.json'
      - name: Assert node-version output is set
        env:
          NODE_VER: ${{ steps.setup.outputs.node-version }}
        run: |
          echo "node-version output: $NODE_VER"
          if [ -z "$NODE_VER" ]; then
            echo "FAIL: node-version output is empty"
            exit 1
          fi
          echo "PASS: node-version output is '$NODE_VER'"
      - name: Assert node major version matches package.json engines.node
        run: |
          echo "node version: $(node --version)"
          MAJOR=$(node --version | sed 's/v//' | cut -d. -f1)
          echo "major version: $MAJOR"
          if [ "$MAJOR" != "18" ]; then
            echo "FAIL: expected major version 18 (from package.json engines.node), got $MAJOR"
            exit 1
          fi
          echo "PASS: node major version is 18 as specified in package.json"
