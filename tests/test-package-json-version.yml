name: Test Node.js setup from package.json engines field
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create package.json with engines field
        run: |
          cat > package.json << 'EOF'
          {
            "name": "test-project",
            "version": "1.0.0",
            "engines": {
              "node": ">=18.0.0"
            }
          }
          EOF
          echo "package.json created:"
          cat package.json
      - id: setup-node
        uses: .
        with:
          node-version-file: 'package.json'
      - name: Assert node-version output is set
        env:
          ACTUAL: ${{ steps.setup-node.outputs.node-version }}
        run: |
          echo "actual node-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: node-version output is empty"
            exit 1
          fi
          echo "PASS: node-version output is '$ACTUAL'"
      - name: Assert node version satisfies >=18
        run: |
          NODE_VERSION=$(node --version)
          echo "node version: $NODE_VERSION"
          # Extract major version number
          MAJOR=$(echo "$NODE_VERSION" | sed 's/v\([0-9]*\).*/\1/')
          echo "major version: $MAJOR"
          if [ "$MAJOR" -lt 18 ]; then
            echo "FAIL: expected node >=18, got $NODE_VERSION"
            exit 1
          fi
          echo "PASS: node version $NODE_VERSION satisfies >=18"
