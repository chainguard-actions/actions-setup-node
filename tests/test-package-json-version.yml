name: Test node-version-file with package.json
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          node-version-file: 'tests/fixtures/package.json'
          token: ${{ github.token }}
      - name: Assert node-version output is set
        env:
          NODE_VER: ${{ steps.setup.outputs.node-version }}
        run: |
          echo "node-version output: $NODE_VER"
          if [ -z "$NODE_VER" ]; then
            echo "FAIL: node-version output is empty"
            exit 1
          fi
          echo "PASS: node-version output is '$NODE_VER'"
      - name: Assert node version satisfies >=18
        run: |
          echo "node version: $(node --version)"
          MAJOR=$(node --version | sed 's/v//' | cut -d. -f1)
          echo "major: $MAJOR"
          if [ "$MAJOR" -lt 18 ]; then
            echo "FAIL: expected node >= 18, got major $MAJOR"
            exit 1
          fi
          echo "PASS: node major version $MAJOR satisfies >=18"
