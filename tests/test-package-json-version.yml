name: Test node version from package.json
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create package.json with engines field
        run: |
          cat > package.json << 'EOF'
          {
            "name": "test-app",
            "version": "1.0.0",
            "engines": {
              "node": "18"
            }
          }
          EOF
          cat package.json
      - id: setup-node
        uses: .
        with:
          node-version-file: 'package.json'
      - name: Assert node-version output is set
        env:
          NODE_VERSION_OUT: ${{ steps.setup-node.outputs.node-version }}
        run: |
          echo "node-version output: $NODE_VERSION_OUT"
          if [ -z "$NODE_VERSION_OUT" ]; then
            echo "FAIL: node-version output is empty"
            exit 1
          fi
          echo "PASS: node-version output is set to $NODE_VERSION_OUT"
      - name: Assert node is available on PATH
        run: |
          NODE_VER=$(node --version)
          echo "node version: $NODE_VER"
          if [ -z "$NODE_VER" ]; then
            echo "FAIL: node is not available"
            exit 1
          fi
          echo "PASS: node is available: $NODE_VER"
      - name: Assert node version matches package.json engines
        run: |
          NODE_VER=$(node --version)
          echo "node version: $NODE_VER"
          MAJOR=$(echo "$NODE_VER" | sed 's/v\([0-9]*\).*/\1/')
          echo "major version: $MAJOR"
          if [ "$MAJOR" != "18" ]; then
            echo "FAIL: expected major version 18, got $MAJOR"
            exit 1
          fi
          echo "PASS: node major version is 18 (from package.json)"
