name: Test mirror-token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-node
        uses: .
        with:
          node-version: '20'
          mirror: 'https://nodejs.org/dist'
          mirror-token: ''
      - name: Assert node-version output is set
        env:
          NODE_VER: ${{ steps.setup-node.outputs.node-version }}
        run: |
          echo "node-version: $NODE_VER"
          if [ -z "$NODE_VER" ]; then
            echo "FAIL: node-version output is empty"
            exit 1
          fi
          echo "PASS: node-version is $NODE_VER"
      - name: Assert node is available
        run: |
          node --version
          echo "PASS: node is available"
