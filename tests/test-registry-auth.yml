name: Test node setup with registry auth
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Pre-populate tool cache with system node
        run: |
          NODE_VERSION=$(node --version | sed 's/v//')
          TOOL_CACHE="${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}"
          NODE_CACHE_DIR="$TOOL_CACHE/node/$NODE_VERSION/x64"
          mkdir -p "$NODE_CACHE_DIR/bin"
          ln -sf "$(which node)" "$NODE_CACHE_DIR/bin/node"
          if which npm > /dev/null 2>&1; then
            ln -sf "$(which npm)" "$NODE_CACHE_DIR/bin/npm"
          fi
          if which npx > /dev/null 2>&1; then
            ln -sf "$(which npx)" "$NODE_CACHE_DIR/bin/npx"
          fi
          touch "$TOOL_CACHE/node/$NODE_VERSION/x64.complete"
          # Write the exact version to a file for the action to read
          echo "$NODE_VERSION" > "$GITHUB_WORKSPACE/.node-version"
          echo "Pre-populated tool cache: $NODE_CACHE_DIR"
      - id: setup
        uses: .
        with:
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org'
          always-auth: 'true'
      - name: Assert node-version output is set
        env:
          NODE_VER: ${{ steps.setup.outputs.node-version }}
        run: |
          echo "node-version output: $NODE_VER"
          if [ -z "$NODE_VER" ]; then
            echo "FAIL: node-version output is empty"
            exit 1
          fi
          echo "PASS: node-version output is '$NODE_VER'"
      - name: Assert .npmrc was created with registry
        run: |
          echo "Looking for .npmrc files..."
          find "$GITHUB_WORKSPACE" -maxdepth 2 -name ".npmrc" 2>/dev/null | head -5
          if [ -f "$GITHUB_WORKSPACE/.npmrc" ]; then
            echo ".npmrc contents:"
            cat "$GITHUB_WORKSPACE/.npmrc"
            if grep -q "registry.npmjs.org" "$GITHUB_WORKSPACE/.npmrc"; then
              echo "PASS: .npmrc contains registry URL"
            else
              echo "FAIL: .npmrc does not contain registry URL"
              exit 1
            fi
          else
            echo "No .npmrc found at workspace root, checking npm config..."
            NPM_REGISTRY=$(npm config get registry 2>/dev/null || echo "")
            echo "npm registry: $NPM_REGISTRY"
            if echo "$NPM_REGISTRY" | grep -q "npmjs.org"; then
              echo "PASS: npm registry is configured as '$NPM_REGISTRY'"
            else
              echo "FAIL: npm registry not configured to npmjs.org (got: $NPM_REGISTRY)"
              exit 1
            fi
          fi
