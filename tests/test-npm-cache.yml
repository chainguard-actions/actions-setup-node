name: Test npm cache setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create package.json and package-lock.json for cache key
        run: |
          cat > package.json <<'EOF'
          {
            "name": "test-app",
            "version": "1.0.0",
            "dependencies": {}
          }
          EOF
          cat > package-lock.json <<'EOF'
          {
            "name": "test-app",
            "version": "1.0.0",
            "lockfileVersion": 3,
            "requires": true,
            "packages": {
              "": {
                "name": "test-app",
                "version": "1.0.0"
              }
            }
          }
          EOF
          echo "Created package.json and package-lock.json"
      - id: setup
        uses: .
        with:
          node-version: '20'
          cache: 'npm'
      - name: Assert node-version output is set
        env:
          NODE_VER: ${{ steps.setup.outputs.node-version }}
        run: |
          echo "node-version output: $NODE_VER"
          if [ -z "$NODE_VER" ]; then
            echo "FAIL: node-version output is empty"
            exit 1
          fi
          echo "PASS: node-version output is '$NODE_VER'"
      - name: Assert cache-hit output is present (true or false)
        env:
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
        run: |
          echo "cache-hit output: $CACHE_HIT"
          if [ "$CACHE_HIT" != "true" ] && [ "$CACHE_HIT" != "false" ] && [ "$CACHE_HIT" != "" ]; then
            echo "FAIL: unexpected cache-hit value: $CACHE_HIT"
            exit 1
          fi
          echo "PASS: cache-hit is '$CACHE_HIT'"
      - name: Assert node is on PATH
        run: |
          ACTUAL=$(node --version)
          echo "node --version: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q '^v20\.'; then
            echo "FAIL: expected node v20.x but got $ACTUAL"
            exit 1
          fi
          echo "PASS"
