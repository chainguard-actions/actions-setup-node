name: Test npm cache setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'tests/fixtures/npm-project/package-lock.json'
      - name: Assert node-version output is set
        env:
          ACTUAL: ${{ steps.setup.outputs.node-version }}
        run: |
          echo "actual node-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: node-version output is empty"
            exit 1
          fi
          echo "PASS: node-version output is set to $ACTUAL"
      - name: Assert cache-hit output is present
        env:
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          # cache-hit can be 'true', 'false', or empty (if cache not available) — all are valid
          if [ "$CACHE_HIT" != "true" ] && [ "$CACHE_HIT" != "false" ] && [ -n "$CACHE_HIT" ]; then
            echo "FAIL: unexpected cache-hit value: $CACHE_HIT"
            exit 1
          fi
          echo "PASS: cache-hit output is acceptable (value: $CACHE_HIT)"
      - name: Assert node is functional
        run: |
          echo "node version: $(node --version)"
          node -e "console.log('Node.js is working')"
          echo "PASS: node is functional"
