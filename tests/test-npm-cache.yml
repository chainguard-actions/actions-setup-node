name: Test npm caching
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          node-version: '20'
          cache: 'npm'
          token: ${{ github.token }}
      - name: Assert node-version output is set
        env:
          NODE_VER: ${{ steps.setup.outputs.node-version }}
        run: |
          echo "node-version output: $NODE_VER"
          if [ -z "$NODE_VER" ]; then
            echo "FAIL: node-version output is empty"
            exit 1
          fi
          echo "PASS: node-version output is '$NODE_VER'"
      - name: Assert cache-primary-key output (optional - cache service may not be available)
        env:
          CACHE_KEY: ${{ steps.setup.outputs.cache-primary-key }}
        run: |
          echo "cache-primary-key: $CACHE_KEY"
          if [ -n "$CACHE_KEY" ]; then
            echo "PASS: cache-primary-key is '$CACHE_KEY'"
          else
            echo "INFO: cache-primary-key is empty (cache service may not be available under act)"
            echo "PASS"
          fi
      - name: Assert node is available
        run: |
          echo "node version: $(node --version)"
          MAJOR=$(node --version | sed 's/v//' | cut -d. -f1)
          if [ "$MAJOR" != "20" ]; then
            echo "FAIL: expected node 20, got $MAJOR"
            exit 1
          fi
          echo "PASS"
