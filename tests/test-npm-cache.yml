name: Test npm cache setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create package.json and package-lock.json for caching
        run: |
          cat > tests/package.json << 'EOF'
          {
            "name": "test-app",
            "version": "1.0.0",
            "description": "Test app for setup-node cache test",
            "dependencies": {}
          }
          EOF
          # Generate a minimal package-lock.json
          cat > tests/package-lock.json << 'EOF'
          {
            "name": "test-app",
            "version": "1.0.0",
            "lockfileVersion": 3,
            "requires": true,
            "packages": {
              "": {
                "name": "test-app",
                "version": "1.0.0"
              }
            }
          }
          EOF
          echo "Created tests/package.json and tests/package-lock.json"
      - id: setup
        uses: .
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'tests/package-lock.json'
      - name: Assert node-version output is set
        env:
          NODE_VERSION: ${{ steps.setup.outputs.node-version }}
        run: |
          echo "node-version output: $NODE_VERSION"
          if [ -z "$NODE_VERSION" ]; then
            echo "FAIL: node-version output is empty"
            exit 1
          fi
          echo "PASS: node-version output is '$NODE_VERSION'"
      - name: Assert cache-hit output (may be empty if cache service unavailable)
        env:
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
        run: |
          echo "cache-hit output: '$CACHE_HIT'"
          # cache-hit can be 'true', 'false', or empty (when cache service is unavailable under act)
          # All of these are valid outcomes
          echo "PASS: cache-hit output is '$CACHE_HIT' (empty is acceptable when cache service is unavailable)"
      - name: Assert node is available
        run: |
          echo "node version: $(node --version)"
          if ! node --version > /dev/null 2>&1; then
            echo "FAIL: node is not available"
            exit 1
          fi
          echo "PASS: node is available"
