name: Test node setup with npm cache
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - name: Assert node-version output is set
        env:
          NODE_VER: ${{ steps.setup.outputs.node-version }}
        run: |
          echo "node-version output: $NODE_VER"
          if [ -z "$NODE_VER" ]; then
            echo "FAIL: node-version output is empty"
            exit 1
          fi
          echo "PASS: node-version output is set to $NODE_VER"
      - name: Assert node is available
        run: |
          echo "node version: $(node --version)"
          MAJOR=$(node --version | sed 's/v//' | cut -d. -f1)
          if [ "$MAJOR" != "20" ]; then
            echo "FAIL: expected major version 20, got $MAJOR"
            exit 1
          fi
          echo "PASS: node major version is 20"
      - name: Assert cache-hit output is present
        env:
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
        run: |
          echo "cache-hit output: $CACHE_HIT"
          # cache-hit can be 'true' or 'false' or empty (if caching not supported in act)
          # We just verify the action completed successfully with caching enabled
          echo "PASS: action completed with npm caching enabled"
