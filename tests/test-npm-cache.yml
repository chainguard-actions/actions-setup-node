name: Test Node.js setup with npm cache
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create package.json with lock file for caching
        run: |
          cat > package.json << 'EOF'
          {
            "name": "test-project",
            "version": "1.0.0",
            "description": "Test project for setup-node cache test",
            "dependencies": {}
          }
          EOF
          # Create a minimal package-lock.json so npm cache can be set up
          cat > package-lock.json << 'EOF'
          {
            "name": "test-project",
            "version": "1.0.0",
            "lockfileVersion": 3,
            "requires": true,
            "packages": {
              "": {
                "name": "test-project",
                "version": "1.0.0"
              }
            }
          }
          EOF
          echo "package.json and package-lock.json created"
      - id: setup-node
        uses: .
        with:
          node-version: '20'
          cache: 'npm'
      - name: Assert node-version output is set
        env:
          NODE_VERSION_OUT: ${{ steps.setup-node.outputs.node-version }}
        run: |
          echo "node-version output: $NODE_VERSION_OUT"
          if [ -z "$NODE_VERSION_OUT" ]; then
            echo "FAIL: node-version output is empty"
            exit 1
          fi
          echo "PASS: node-version output is set to $NODE_VERSION_OUT"
      - name: Assert cache-hit output is present (true or false)
        env:
          CACHE_HIT: ${{ steps.setup-node.outputs.cache-hit }}
        run: |
          echo "cache-hit output: $CACHE_HIT"
          if [ "$CACHE_HIT" != "true" ] && [ "$CACHE_HIT" != "false" ] && [ "$CACHE_HIT" != "" ]; then
            echo "FAIL: cache-hit output has unexpected value: $CACHE_HIT"
            exit 1
          fi
          echo "PASS: cache-hit output is '$CACHE_HIT'"
      - name: Assert node is available
        run: |
          echo "node version: $(node --version)"
          NODE_MAJOR=$(node --version | sed 's/v//' | cut -d. -f1)
          if [ "$NODE_MAJOR" != "20" ]; then
            echo "FAIL: expected node major version 20, got $NODE_MAJOR"
            exit 1
          fi
          echo "PASS: node major version is 20"
