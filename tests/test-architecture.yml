name: Test architecture input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          node-version: '20'
          architecture: x64
      - name: Assert node version output is set
        env:
          NODE_VER: ${{ steps.action.outputs.node-version }}
        run: |
          echo "node-version: $NODE_VER"
          if [ -z "$NODE_VER" ]; then
            echo "FAIL: node-version output is empty"
            exit 1
          fi
          echo "PASS: node-version is $NODE_VER"
      - name: Assert node is available and is x64
        run: |
          node --version
          ARCH=$(node -e "console.log(process.arch)")
          echo "arch: $ARCH"
          if [ "$ARCH" != "x64" ]; then
            echo "FAIL: expected x64 but got $ARCH"
            exit 1
          fi
          echo "PASS: architecture is x64"
