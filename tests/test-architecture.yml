name: Test architecture input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: setup-node
        uses: .
        with:
          node-version: '20'
          architecture: 'x64'
      - name: Assert node-version output is set
        env:
          ACTUAL: ${{ steps.setup-node.outputs.node-version }}
        run: |
          echo "actual node-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: node-version output should not be empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert node is available and is x64
        run: |
          node --version
          ARCH=$(node -e "console.log(process.arch)")
          echo "node arch: $ARCH"
          if [ "$ARCH" != "x64" ]; then
            echo "FAIL: expected x64 architecture, got $ARCH"
            exit 1
          fi
          echo "PASS"
