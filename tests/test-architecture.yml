name: Test architecture input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          node-version: '20'
          architecture: x64
      - name: Assert node version output and architecture
        env:
          ACTUAL: ${{ steps.action.outputs.node-version }}
        run: |
          echo "actual: $ACTUAL"
          case "$ACTUAL" in
            v20.*) ;;
            *) echo "FAIL: expected v20.x"; exit 1 ;;
          esac
          ARCH="$(node -p 'process.arch')"
          echo "arch: $ARCH"
          if [ "$ARCH" != "x64" ]; then
            echo "FAIL: expected x64 arch"
            exit 1
          fi
          INSTALLED="$(node --version)"
          if [ "$INSTALLED" != "$ACTUAL" ]; then
            echo "FAIL: node --version ($INSTALLED) != output ($ACTUAL)"
            exit 1
          fi
          echo "PASS"
