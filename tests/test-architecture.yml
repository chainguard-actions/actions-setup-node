name: Test architecture input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-node
        uses: .
        with:
          node-version: '20'
          architecture: x64
      - name: Assert node is installed
        run: |
          echo "node version: $(node --version)"
          if ! node --version > /dev/null 2>&1; then
            echo "FAIL: node is not installed"
            exit 1
          fi
          echo "PASS: node is installed"
      - name: Assert node-version output is set
        env:
          ACTUAL: ${{ steps.setup-node.outputs.node-version }}
        run: |
          echo "actual node-version output: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: node-version output is empty"
            exit 1
          fi
          echo "PASS: node-version output is set to $ACTUAL"
      - name: Assert architecture is x64
        run: |
          ARCH=$(node -e "console.log(process.arch)")
          echo "node arch: $ARCH"
          if [ "$ARCH" != "x64" ]; then
            echo "FAIL: expected x64 but got $ARCH"
            exit 1
          fi
          echo "PASS: architecture is x64"
