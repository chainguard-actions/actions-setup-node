name: Test always-auth configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          node-version: '20'
          always-auth: 'true'
          registry-url: 'https://registry.npmjs.org'
      - name: Assert node-version output is set
        env:
          NODE_VER: ${{ steps.setup.outputs.node-version }}
        run: |
          echo "node-version output: $NODE_VER"
          if [ -z "$NODE_VER" ]; then
            echo "FAIL: node-version output is empty"
            exit 1
          fi
          echo "PASS: node-version output is '$NODE_VER'"
      - name: Assert always-auth is set in npmrc
        run: |
          echo "Checking for always-auth in .npmrc..."
          echo "NPM_CONFIG_USERCONFIG: $NPM_CONFIG_USERCONFIG"
          echo "RUNNER_TEMP: $RUNNER_TEMP"
          FOUND=false
          # The action writes .npmrc to RUNNER_TEMP (exported as NPM_CONFIG_USERCONFIG)
          # Check all possible locations
          for f in "$NPM_CONFIG_USERCONFIG" "$RUNNER_TEMP/.npmrc" "$GITHUB_WORKSPACE/.npmrc" "$HOME/.npmrc"; do
            if [ -n "$f" ] && [ -f "$f" ]; then
              echo "Contents of $f:"
              cat "$f"
              if grep -q "always-auth" "$f"; then
                FOUND=true
                echo "Found always-auth in $f"
              fi
            fi
          done
          if [ "$FOUND" = "true" ]; then
            echo "PASS: always-auth is configured in npmrc"
          else
            echo "FAIL: always-auth not found in any .npmrc file"
            exit 1
          fi
      - name: Assert node is available
        run: |
          echo "node version: $(node --version)"
          MAJOR=$(node --version | sed 's/v//' | cut -d. -f1)
          if [ "$MAJOR" != "20" ]; then
            echo "FAIL: expected node 20, got $MAJOR"
            exit 1
          fi
          echo "PASS"
