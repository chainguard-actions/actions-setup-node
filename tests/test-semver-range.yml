name: Test node setup with semver range
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Pre-populate tool cache with system node
        run: |
          NODE_VERSION=$(node --version | sed 's/v//')
          TOOL_CACHE="${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}"
          NODE_CACHE_DIR="$TOOL_CACHE/node/$NODE_VERSION/x64"
          mkdir -p "$NODE_CACHE_DIR/bin"
          ln -sf "$(which node)" "$NODE_CACHE_DIR/bin/node"
          if which npm > /dev/null 2>&1; then
            ln -sf "$(which npm)" "$NODE_CACHE_DIR/bin/npm"
          fi
          if which npx > /dev/null 2>&1; then
            ln -sf "$(which npx)" "$NODE_CACHE_DIR/bin/npx"
          fi
          touch "$TOOL_CACHE/node/$NODE_VERSION/x64.complete"
          echo "Pre-populated tool cache: $NODE_CACHE_DIR (version $NODE_VERSION)"
      - id: setup
        uses: .
        with:
          node-version: '>=18.0.0'
      - name: Assert node-version output is set
        env:
          NODE_VER: ${{ steps.setup.outputs.node-version }}
        run: |
          echo "node-version output: $NODE_VER"
          if [ -z "$NODE_VER" ]; then
            echo "FAIL: node-version output is empty"
            exit 1
          fi
          echo "PASS: node-version output is '$NODE_VER'"
      - name: Assert node version satisfies semver range
        run: |
          echo "node version: $(node --version)"
          MAJOR=$(node --version | sed 's/v//' | cut -d. -f1)
          echo "major version: $MAJOR"
          if [ "$MAJOR" -lt 18 ]; then
            echo "FAIL: expected node >= 18, got major version $MAJOR"
            exit 1
          fi
          echo "PASS: node version satisfies >=18.0.0 (major: $MAJOR)"
      - name: Assert node binary is functional
        run: |
          RESULT=$(node -e "console.log(1 + 1)")
          echo "node eval result: $RESULT"
          if [ "$RESULT" != "2" ]; then
            echo "FAIL: node evaluation returned unexpected result: $RESULT"
            exit 1
          fi
          echo "PASS: node is functional"
