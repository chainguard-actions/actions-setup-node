name: Test Node.js setup with check-latest
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: setup-node
        uses: .
        with:
          node-version: '20'
          check-latest: true
      - name: Assert node-version output is set
        env:
          ACTUAL: ${{ steps.setup-node.outputs.node-version }}
        run: |
          echo "actual node-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: node-version output is empty"
            exit 1
          fi
          echo "PASS: node-version output is '$ACTUAL'"
      - name: Assert node binary is available and is v20
        run: |
          NODE_VERSION=$(node --version)
          echo "node version: $NODE_VERSION"
          if [[ "$NODE_VERSION" != v20* ]]; then
            echo "FAIL: expected node v20.x, got $NODE_VERSION"
            exit 1
          fi
          echo "PASS: node version matches v20.x with check-latest enabled"
      - name: Assert npm is available
        run: |
          NPM_VERSION=$(npm --version)
          echo "npm version: $NPM_VERSION"
          if [ -z "$NPM_VERSION" ]; then
            echo "FAIL: npm not found"
            exit 1
          fi
          echo "PASS: npm is available at version $NPM_VERSION"
