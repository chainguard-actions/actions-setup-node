name: Test Node.js setup with check-latest
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TOOL_CACHE: /tmp/hostedtoolcache
      RUNNER_TEMP: /tmp/runner-temp
      RUNNER_OS: Linux
      RUNNER_ARCH: X64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare runner environment
        run: |
          mkdir -p /tmp/hostedtoolcache
          mkdir -p /tmp/runner-temp
      - id: setup-node
        uses: .
        with:
          node-version: '20'
          check-latest: true
      - name: Assert node-version output is set
        env:
          NODE_VERSION_OUT: ${{ steps.setup-node.outputs.node-version }}
        run: |
          echo "node-version output: $NODE_VERSION_OUT"
          if [ -z "$NODE_VERSION_OUT" ]; then
            echo "FAIL: node-version output is empty"
            exit 1
          fi
          echo "PASS: node-version output is set to $NODE_VERSION_OUT"
      - name: Assert node major version is 20
        run: |
          echo "node version: $(node --version)"
          NODE_MAJOR=$(node --version | sed 's/v//' | cut -d. -f1)
          echo "node major: $NODE_MAJOR"
          if [ "$NODE_MAJOR" != "20" ]; then
            echo "FAIL: expected node major version 20, got $NODE_MAJOR"
            exit 1
          fi
          echo "PASS: node major version is 20"
      - name: Assert npm is available
        run: |
          echo "npm version: $(npm --version)"
          if ! command -v npm &> /dev/null; then
            echo "FAIL: npm is not available"
            exit 1
          fi
          echo "PASS: npm is available"
